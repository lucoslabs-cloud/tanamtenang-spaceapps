# Build and publish to GitHub Pages on every push to main.
#
# The build step is `npm run build`, which type-checks before it bundles, so
# a push that breaks the engine fails here rather than quietly shipping a
# broken map to whoever opens the submission link.
#
# Nothing is pre-generated: the snapshot under public/data is committed, so
# this needs no database, no Earthdata token and no secrets at all.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-done: an interrupted
# deploy leaves the live site mid-swap, and this is the link on a submission.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
